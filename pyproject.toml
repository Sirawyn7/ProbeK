[project]
name = "probek"
version = "0.1.0"
description = "Genomic off-target tier ranking pipeline for HERV-K FISH probe candidates"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
pyranges = ["pyranges"]
pyranges1 = ["pyranges1"]
dev = ["pytest>=7.4"]

[project.scripts]
probek = "probek.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["probek*"]
